pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Auto-provisions JDK toolchains (e.g. Java 25 required by MC 26.1.2)
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}